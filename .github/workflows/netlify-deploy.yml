name: Deploy to Netlify

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site
        run: |
          mkdir -p /tmp/netlify-publish
          rsync -a ./ /tmp/netlify-publish/ --exclude '.git' --exclude '.github' --exclude 'GITHUB_LOGIN_NETLIFY_SETUP.md'
          npx netlify-cli@17.38.0 deploy --dir=/tmp/netlify-publish --prod --site="${{ secrets.NETLIFY_SITE_ID }}" --auth="${{ secrets.NETLIFY_AUTH_TOKEN }}"
