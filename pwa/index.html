<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050a12">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KN3AUX">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <title>KN3AUX-CODE - Termux IDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
        
        :root {
            --bg: #050a12;
            --surface: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e8f4ff;
            --accent: #63d2ff;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .pulse { animation: pulse 2s infinite; }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-up { animation: slideUp 0.4s ease; }
        
        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 64px;
            background: rgba(5,10,18,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 16px;
            color: var(--text);
            text-decoration: none;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .nav-item.active {
            color: var(--accent);
        }
        
        .nav-item:active {
            transform: scale(0.95);
        }
        
        /* Install Prompt */
        .install-prompt {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 16px;
            z-index: 999;
            display: none;
        }
        
        .install-prompt.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        
        /* Terminal */
        .terminal {
            background: #040608;
            color: #90c890;
            font-family: 'JetBrains Mono', monospace;
            padding: 16px;
            height: 400px;
            overflow-y: auto;
            border-radius: 12px;
            font-size: 13px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="sticky top-0 z-100 glass">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center">
                    <i data-lucide="git-branch" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold">KN3AUX<span class="text-cyan-400">.</span>CODE</h1>
                    <p class="text-xs text-gray-400">Termux IDE v5.0</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-green-400 flex items-center gap-1">
                    <span class="w-2 h-2 bg-green-400 rounded-full pulse"></span>
                    Online
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 pb-24">
        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="glass rounded-xl p-4 flex items-center gap-3 animate-slide-up">
                <div class="text-cyan-400"><i data-lucide="battery" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-xs text-gray-400">Battery</p>
                    <p class="text-lg font-bold font-mono" id="battery">87%</p>
                </div>
            </div>
            <div class="glass rounded-xl p-4 flex items-center gap-3 animate-slide-up" style="animation-delay: 0.1s">
                <div class="text-green-400"><i data-lucide="cpu" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-xs text-gray-400">CPU</p>
                    <p class="text-lg font-bold font-mono" id="cpu">34%</p>
                </div>
            </div>
            <div class="glass rounded-xl p-4 flex items-center gap-3 animate-slide-up" style="animation-delay: 0.2s">
                <div class="text-purple-400"><i data-lucide="hard-drive" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-xs text-gray-400">Memory</p>
                    <p class="text-lg font-bold font-mono" id="memory">61%</p>
                </div>
            </div>
            <div class="glass rounded-xl p-4 flex items-center gap-3 animate-slide-up" style="animation-delay: 0.3s">
                <div class="text-blue-400"><i data-lucide="wifi" class="w-5 h-5"></i></div>
                <div>
                    <p class="text-xs text-gray-400">Network</p>
                    <p class="text-lg font-bold font-mono">5G</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="glass rounded-xl p-4 mb-6">
            <h2 class="text-sm font-bold mb-3 flex items-center gap-2">
                <i data-lucide="zap" class="w-4 h-4"></i>
                Quick Actions
            </h2>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="runCommand('frp')" class="p-3 rounded-lg bg-gradient-to-br from-orange-500 to-red-500 text-white text-xs font-semibold">
                    <i data-lucide="shield" class="w-5 h-5 mx-auto mb-1"></i>
                    FRP Remove
                </button>
                <button onclick="runCommand('mtk')" class="p-3 rounded-lg bg-gradient-to-br from-cyan-500 to-blue-500 text-white text-xs font-semibold">
                    <i data-lucide="smartphone" class="w-5 h-5 mx-auto mb-1"></i>
                    MTK Tools
                </button>
                <button onclick="runCommand('backup')" class="p-3 rounded-lg bg-gradient-to-br from-green-500 to-emerald-500 text-white text-xs font-semibold">
                    <i data-lucide="database" class="w-5 h-5 mx-auto mb-1"></i>
                    Backup
                </button>
            </div>
        </div>

        <!-- Terminal -->
        <div class="glass rounded-xl p-4 mb-6">
            <h2 class="text-sm font-bold mb-3 flex items-center gap-2">
                <i data-lucide="terminal" class="w-4 h-4"></i>
                Termux Terminal
            </h2>
            <div class="terminal" id="terminal-output">
                <div class="text-gray-400">$ KN3AUX-CODE PWA initialized...</div>
                <div class="text-gray-400">$ Ready for commands</div>
            </div>
            <div class="mt-3 flex gap-2">
                <input type="text" id="terminal-input" placeholder="Enter command..." 
                    class="flex-1 bg-gray-800 rounded-lg px-3 py-2 text-sm font-mono outline-none border border-gray-700 focus:border-cyan-400">
                <button onclick="runTerminalCommand()" class="px-4 py-2 bg-cyan-500 rounded-lg text-white">
                    <i data-lucide="send" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Plugin Grid -->
        <div>
            <h2 class="text-sm font-bold mb-3 flex items-center gap-2">
                <i data-lucide="grid-3x3" class="w-4 h-4"></i>
                Modules
                <span class="text-xs bg-gray-800 px-2 py-1 rounded">16</span>
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="plugin-grid"></div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#dashboard" class="nav-item active" onclick="showPage('dashboard')">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span>Home</span>
        </a>
        <a href="#terminal" class="nav-item" onclick="showPage('terminal')">
            <i data-lucide="terminal" class="w-5 h-5"></i>
            <span>Terminal</span>
        </a>
        <a href="#tools" class="nav-item" onclick="showPage('tools')">
            <i data-lucide="wrench" class="w-5 h-5"></i>
            <span>Tools</span>
        </a>
        <a href="#settings" class="nav-item" onclick="showPage('settings')">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Install Prompt -->
    <div class="install-prompt" id="install-prompt">
        <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center">
                    <i data-lucide="download" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Install KN3AUX App</h3>
                    <p class="text-xs text-gray-400">Add to home screen for quick access</p>
                </div>
            </div>
            <button onclick="dismissInstall()" class="text-gray-400 hover:text-white">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
        <button onclick="installApp()" class="w-full py-2 bg-cyan-500 rounded-lg text-white text-sm font-semibold">
            Install App
        </button>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Plugin data
        const plugins = [
            { name: 'Network', icon: 'globe', color: 'cyan', status: 'active' },
            { name: 'Metasploit', icon: 'zap', color: 'red', status: 'active' },
            { name: 'Reverse', icon: 'code', color: 'purple', status: 'active' },
            { name: 'WiFi', icon: 'wifi', color: 'green', status: 'idle' },
            { name: 'Web', icon: 'globe', color: 'yellow', status: 'idle' },
            { name: 'Scripts', icon: 'terminal', color: 'gray', status: 'active' },
            { name: 'Root', icon: 'smartphone', color: 'indigo', status: 'idle' },
            { name: 'Carrier', icon: 'lock', color: 'pink', status: 'idle' },
            { name: 'FRP', icon: 'shield', color: 'orange', status: 'idle' },
            { name: 'APK', icon: 'box', color: 'teal', status: 'active' },
            { name: 'AI', icon: 'radio', color: 'violet', status: 'active' },
            { name: 'Backup', icon: 'database', color: 'emerald', status: 'idle' },
            { name: 'MTK', icon: 'wrench', color: 'rose', status: 'active' },
            { name: 'Device', icon: 'activity', color: 'lime', status: 'active' },
            { name: 'Plugins', icon: 'layers', color: 'fuchsia', status: 'active' },
            { name: 'Settings', icon: 'settings', color: 'slate', status: 'idle' },
        ];

        // Render plugins
        const grid = document.getElementById('plugin-grid');
        plugins.forEach((p, i) => {
            const card = document.createElement('div');
            card.className = 'glass rounded-xl p-3 cursor-pointer hover:-translate-y-1 transition-all duration-300';
            card.style.animation = `slideUp 0.4s ease ${i * 0.05}s both`;
            card.onclick = () => openPlugin(p.name);
            card.innerHTML = `
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-${p.color}-500 to-${p.color}-600 flex items-center justify-center mb-2">
                    <i data-lucide="${p.icon}" class="w-5 h-5 text-white"></i>
                </div>
                <h3 class="font-bold text-xs mb-1">${p.name}</h3>
                <div class="flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full ${p.status === 'active' ? 'bg-green-400' : 'bg-gray-500'}"></span>
                    <span class="text-xs ${p.status === 'active' ? 'text-green-400' : 'text-gray-500'}">${p.status}</span>
                </div>
            `;
            grid.appendChild(card);
        });

        setTimeout(() => lucide.createIcons(), 100);

        // Live stats
        setInterval(() => {
            document.getElementById('battery').textContent = Math.floor(Math.random() * 10 + 80) + '%';
            document.getElementById('cpu').textContent = Math.floor(Math.random() * 30 + 20) + '%';
            document.getElementById('memory').textContent = Math.floor(Math.random() * 20 + 50) + '%';
        }, 2000);

        // Terminal
        function runTerminalCommand() {
            const input = document.getElementById('terminal-input');
            const output = document.getElementById('terminal-output');
            const cmd = input.value.trim();
            
            if (cmd) {
                output.innerHTML += `<div class="text-cyan-400 mt-2">$ ${cmd}</div>`;
                output.innerHTML += `<div class="text-gray-300">Command executed: ${cmd}</div>`;
                input.value = '';
                output.scrollTop = output.scrollHeight;
            }
        }

        function runCommand(type) {
            const output = document.getElementById('terminal-output');
            output.innerHTML += `<div class="text-green-400 mt-2">✓ Running ${type} tool...</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function openPlugin(name) {
            alert(`Opening ${name} module...`);
        }

        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-prompt').classList.add('show');
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    document.getElementById('install-prompt').classList.remove('show');
                });
            }
        }

        function dismissInstall() {
            document.getElementById('install-prompt').classList.remove('show');
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg))
                .catch(err => console.log('SW error:', err));
        }

        // Page navigation
        function showPage(page) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
        }
    </script>
</body>
</html>
